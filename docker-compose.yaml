services:
  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: ./app/Dockerfile.backend
    container_name: churn-api
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./models:/app/models:ro
      - ./app:/app:ro
    networks:
      - churn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Streamlit Frontend Service
  frontend:
    build:
      context: .
      dockerfile: ./app/Dockerfile.frontend
    container_name: churn-frontend
    environment:
      - API_BASE_URL=http://backend:8000
    volumes:
      - ./app:/app:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - churn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: churn-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - churn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  churn-network:
    driver: bridge

volumes:
  models-data:
    driver: local